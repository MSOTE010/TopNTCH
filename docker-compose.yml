version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: topntch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: topntch
      POSTGRES_PASSWORD: topntch
      POSTGRES_DB: topntch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: topntch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres-data: